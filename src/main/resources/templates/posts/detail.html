<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 상세</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><main class="container py-5" style="max-width:900px"><a th:href="@{/posts}">← 목록</a><div class="card shadow-sm mt-3"><div class="card-body p-4"><div class="eyebrow" th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">작성일</div><h1 th:text="${post.title}">게시글 제목</h1><p class="post-content" th:text="${post.content}">게시글 내용</p><hr><h5>첨부파일 <span class="text-secondary" th:text="${#lists.size(post.attachments)}">0</span></h5><p class="text-secondary" th:if="${#lists.isEmpty(post.attachments)}">첨부파일이 없습니다.</p><ul class="list-group" th:if="${!#lists.isEmpty(post.attachments)}"><li class="list-group-item d-flex justify-content-between align-items-center gap-3 py-3" th:each="file : ${post.attachments}">
    <div class="attachment-info">
        <strong class="d-block text-break" th:text="${file.originalFilename}">sample.pdf</strong>
        <small class="d-block text-secondary mt-1" th:text="${file.fileSize / 1024} + ' KB'">크기</small>
    </div>
    <a class="btn btn-outline-primary btn-sm flex-shrink-0" th:href="@{/attachments/{id}/download(id=${file.id})}">다운로드</a>
</li></ul><div class="mt-3"><!-- STUDENT TODO: 이미지 파일이면 /attachments/{id}/view 경로를 사용해 미리보기 표시 --></div><div class="d-flex gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a><form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" onsubmit="return confirm('게시글을 삭제할까요?')"><button class="btn btn-outline-danger">삭제</button></form></div></div></div></main></body></html>
