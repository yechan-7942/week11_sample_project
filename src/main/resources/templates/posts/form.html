<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>게시글 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width:780px"><a th:href="@{/posts}">← 목록</a>
    <h1 class="mt-3" th:text="${postId == null ? '게시글 작성' : '게시글 수정'}">게시글 작성</h1>
    <form class="card p-4 shadow-sm" th:object="${postForm}"
          th:action="${postId == null ? '/posts' : '/posts/' + postId + '/edit'}" method="post"
          enctype="multipart/form-data"><label class="form-label mt-2">제목</label><input class="form-control"
                                                                                        th:field="*{title}"
                                                                                        maxlength="120" required>
        <div class="text-danger" th:errors="*{title}"></div>
        <label class="form-label mt-3">내용</label><textarea class="form-control" rows="6" th:field="*{content}"
                                                           required></textarea>
        <div class="text-danger" th:errors="*{content}"></div>
        <div th:if="${postId == null}"><label class="form-label mt-3">첨부파일</label><input class="form-control"
                                                                                         type="file" name="files"
                                                                                         multiple
                                                                                         accept=".jpg,.jpeg,.png,.gif,.pdf,.txt">
            <div class="form-text">JPG, PNG, GIF, PDF, TXT · 각 파일 최대 10MB</div>
        </div>
        <div th:if="${postId != null}" class="form-text mt-3">수정에서는 제목과 본문만 변경합니다.</div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">저장</button>
        </div>
    </form>
</main>
</body>
</html>
