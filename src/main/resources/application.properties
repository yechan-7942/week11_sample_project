spring.application.name=week11-attachment-board
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/web11}
spring.datasource.username=${DB_USERNAME:webuser}
spring.datasource.password=${DB_PASSWORD:webpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=${UPLOAD_DIR:uploads}
server.error.include-message=always

